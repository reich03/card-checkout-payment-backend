name: Backend CI/CD

on:
  push:
    branches: [production, main]
  pull_request:
    branches: [production, main]

jobs:
  ci:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npx jest --watchman=false --ci

  deploy:
    name: Deploy API to EC2
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          # Preserve real newlines; also accept secrets pasted with literal \n
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" | sed 's/\r$//' > ~/.ssh/ec2.pem
          if grep -q '\\n' ~/.ssh/ec2.pem; then
            sed -i 's/\\n/\n/g' ~/.ssh/ec2.pem
          fi
          chmod 600 ~/.ssh/ec2.pem
          # Fail early with a clear message if the key is still invalid
          ssh-keygen -y -f ~/.ssh/ec2.pem >/dev/null
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync backend (keep remote .env)
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            --exclude .env \
            --exclude lambda/dist \
            -e "ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/backend/"

      - name: Rebuild and restart containers
        run: |
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'cd ~/backend && docker compose up -d --build'

  deploy-lambda:
    name: Deploy Lambda
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      # Dynamo table names default in serverless.yml (Products / Transactions)
      PAYMENT_API_BASE_URL: ${{ secrets.PAYMENT_API_BASE_URL }}
      PAYMENT_API_PUBLIC_KEY: ${{ secrets.PAYMENT_API_PUBLIC_KEY }}
      PAYMENT_API_PRIVATE_KEY: ${{ secrets.PAYMENT_API_PRIVATE_KEY }}
      PAYMENT_API_INTEGRITY_KEY: ${{ secrets.PAYMENT_API_INTEGRITY_KEY }}
      PAYMENT_API_EVENTS_KEY: ${{ secrets.PAYMENT_API_EVENTS_KEY }}
      # Optional — leave empty if you only want console alarms (no email)
      ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
      RECONCILE_OLDER_THAN_MINUTES: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Lambda bundles
        run: npm run lambda:build

      - name: Deploy with Serverless
        working-directory: lambda
        run: npx serverless@3 deploy --stage dev --region us-east-2
